<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TETRIS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root {
    --bg-deep: #eaf6ff;
    --bg-mid: #ffffff;
    --ink: #1b1a35;
    --shadow: #100f24;
    --accent-yellow: #f4a300;
    --accent-pink: #ff477e;
    --accent-cyan: #0096c7;
    --accent-green: #0aa88f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    font-family: 'Press Start 2P', monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  #stage {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  #frame {
    position: relative;
    width: min(100%, 460px);
    height: 100%;
    max-height: 800px;
    background: linear-gradient(to bottom, #bde0fe 0%, #d7f0ff 30%, #eaf6ff 65%, #ffe8d6 100%);
    border-left: 4px solid #8ecae6;
    border-right: 4px solid #8ecae6;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    padding: 14px 16px 6px;
    flex: 0 0 auto;
  }
  .hud-box { color: var(--ink); font-size: 10px; line-height: 1.7; }
  .hud-box .label { color: var(--accent-cyan); font-size: 8px; }
  .hud-box .value { font-size: 14px; color: var(--accent-yellow); text-shadow: 2px 2px 0 var(--shadow); }

  .mid-row {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 0;
    padding: 2px 10px;
    position: relative;
  }

  canvas#game {
    display: block;
    image-rendering: pixelated;
    border: 4px solid var(--shadow);
    background: var(--bg-mid);
    box-shadow: 6px 6px 0 rgba(16,15,36,0.2);
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 78px;
  }

  .next-box {
    background: var(--bg-mid);
    border: 3px solid var(--shadow);
    box-shadow: 4px 4px 0 rgba(16,15,36,0.2);
    padding: 6px;
  }
  .next-box .lbl {
    font-size: 7px; color: var(--accent-cyan); margin-bottom: 6px; text-align: center;
  }
  canvas#nextCv { display: block; margin: 0 auto; image-rendering: pixelated; }

  .center-msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: var(--ink);
    pointer-events: none;
    z-index: 6;
    animation: blink 1.4s steps(2, start) infinite;
    width: 90%;
  }
  .center-msg .title {
    font-size: 15px; color: var(--accent-pink);
    text-shadow: 3px 3px 0 rgba(16,15,36,0.25);
    margin-bottom: 10px;
    background: rgba(255,255,255,0.88);
    display: inline-block; padding: 6px 10px;
  }
  .center-msg .sub {
    font-size: 7px; color: var(--ink); line-height: 1.9;
    background: rgba(255,255,255,0.88);
    display: inline-block; padding: 6px 10px;
  }
  @keyframes blink { 0%,60%{opacity:1;} 80%{opacity:0.4;} 100%{opacity:1;} }

  .controls {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 50px 50px 50px 50px;
    gap: 6px;
    justify-content: center;
    padding: 8px 0 16px;
  }
  .controls button {
    font-family: inherit;
    font-size: 12px;
    background: var(--bg-mid);
    color: var(--ink);
    border: 3px solid var(--shadow);
    box-shadow: 3px 3px 0 var(--shadow);
    cursor: pointer;
    height: 44px;
  }
  .controls button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--shadow); }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(16,15,36,0.55);
    z-index: 10; opacity: 0; pointer-events: none;
    transition: opacity 0.25s steps(3);
  }
  .overlay.show { opacity: 1; pointer-events: all; }
  .panel {
    background: var(--bg-mid);
    border: 4px solid var(--accent-pink);
    box-shadow: 8px 8px 0 var(--shadow);
    padding: 24px 20px; text-align: center;
    width: 82%; max-width: 300px;
  }
  .panel .heading {
    color: var(--accent-pink); font-size: 14px;
    text-shadow: 2px 2px 0 rgba(16,15,36,0.2);
    margin-bottom: 16px;
  }
  .panel .row { display:flex; justify-content:space-between; color:var(--ink); font-size:9px; margin-bottom:9px; }
  .panel .row .num { color: var(--accent-pink); }
  .panel .best-flag { display:inline-block; margin-top:4px; font-size:7px; color:var(--accent-green); }

  button.pixel-btn {
    margin-top: 14px; font-family: inherit; font-size: 9px;
    color: var(--ink); background: var(--accent-yellow);
    border: 4px solid var(--shadow); box-shadow: 5px 5px 0 var(--shadow);
    padding: 10px 14px; cursor: pointer; width: 100%;
  }
  button.pixel-btn:active { box-shadow: 2px 2px 0 var(--shadow); transform: translate(3px,3px); }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <div class="hud">
      <div class="hud-box"><div class="label">SCORE</div><div class="value" id="scoreVal">0</div></div>
      <div class="hud-box"><div class="label">LINES</div><div class="value" id="linesVal">0</div></div>
      <div class="hud-box" style="text-align:right;"><div class="label">BEST</div><div class="value" id="bestVal">0</div></div>
    </div>

    <div class="mid-row">
      <canvas id="game"></canvas>
      <div class="side">
        <div class="next-box">
          <div class="lbl">NEXT</div>
          <canvas id="nextCv" width="60" height="60"></canvas>
        </div>
      </div>

      <div class="center-msg" id="startMsg">
        <div class="title">TETRIS</div><br>
        <div class="sub">ARROWS OR WASD<br>SPACE / ▼ TO DROP</div>
      </div>

      <div class="overlay" id="overOverlay">
        <div class="panel">
          <div class="heading">GAME OVER</div>
          <div class="row"><span>SCORE</span><span class="num" id="finalScore">0</span></div>
          <div class="row"><span>BEST</span><span class="num" id="finalBest">0</span></div>
          <div class="best-flag" id="newBestFlag" style="visibility:hidden;">NEW BEST!</div>
          <button class="pixel-btn" id="retryBtn">PLAY AGAIN</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button data-act="left">◀</button>
      <button data-act="rotate">▲</button>
      <button data-act="right">▶</button>
      <button data-act="drop">▼</button>
    </div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const nextCv = document.getElementById('nextCv');
  const nctx = nextCv.getContext('2d');
  const midRow = document.querySelector('.mid-row');
  const startMsg = document.getElementById('startMsg');
  const overOverlay = document.getElementById('overOverlay');
  const scoreVal = document.getElementById('scoreVal');
  const linesVal = document.getElementById('linesVal');
  const bestVal = document.getElementById('bestVal');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const newBestFlag = document.getElementById('newBestFlag');
  const retryBtn = document.getElementById('retryBtn');
  const controls = document.querySelector('.controls');

  const COLS = 10, ROWS = 18;
  let cell = 20, DPR = 1;

  const COLORS = {
    I: '#0096c7', O: '#f4a300', T: '#8338ec',
    S: '#0aa88f', Z: '#ff477e', J: '#3a6fd8', L: '#ff9f4a'
  };
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  const KEYS = Object.keys(SHAPES);

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const availW = midRow.clientWidth - 100;
    const availH = midRow.clientHeight - 6;
    let w = Math.floor(availW / COLS) * COLS;
    let size = Math.min(w, Math.floor(availH / ROWS) * ROWS * (COLS / ROWS));
    cell = Math.max(10, Math.floor(Math.min(availW / COLS, availH / ROWS)));
    const pw = cell * COLS, ph = cell * ROWS;
    canvas.style.width = pw + 'px';
    canvas.style.height = ph + 'px';
    canvas.width = pw * DPR;
    canvas.height = ph * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  let board, cur, curKey, curRot, curX, curY, nextKey;
  let score = 0, lines = 0, best = 0, state = 'ready';
  let tickMs = 650, acc = 0, lastT = 0;

  function emptyBoard() {
    const b = [];
    for (let y = 0; y < ROWS; y++) b.push(new Array(COLS).fill(null));
    return b;
  }

  function rotateCells(cells, rot) {
    let pts = cells.map(p => [p[0]-1.5, p[1]-1.5]);
    for (let r = 0; r < rot; r++) pts = pts.map(([x,y]) => [-y, x]);
    return pts.map(([x,y]) => [Math.round(x+1.5), Math.round(y+1.5)]);
  }

  function spawn() {
    curKey = nextKey || KEYS[Math.floor(Math.random()*KEYS.length)];
    nextKey = KEYS[Math.floor(Math.random()*KEYS.length)];
    curRot = 0;
    curX = 3; curY = -1;
    cur = rotateCells(SHAPES[curKey], 0);
    drawNext();
    if (collides(cur, curX, curY)) { endGame(); }
  }

  function collides(cells, ox, oy) {
    for (const [cx, cy] of cells) {
      const x = ox + cx, y = oy + cy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && board[y][x]) return true;
    }
    return false;
  }

  function lockPiece() {
    for (const [cx, cy] of cur) {
      const x = curX + cx, y = curY + cy;
      if (y >= 0) board[y][x] = curKey;
    }
    clearLines();
    spawn();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (board[y].every(c => c)) {
        board.splice(y, 1);
        board.unshift(new Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared];
      score += points;
      lines += cleared;
      scoreVal.textContent = String(score);
      linesVal.textContent = String(lines);
      tickMs = Math.max(180, 650 - lines * 12);
    }
  }

  function tryMove(dx, dy) {
    if (state !== 'playing') return false;
    if (!collides(cur, curX + dx, curY + dy)) {
      curX += dx; curY += dy;
      return true;
    }
    if (dy > 0) lockPiece();
    return false;
  }

  function tryRotate() {
    if (state !== 'playing') return;
    const nr = (curRot + 1) % 4;
    const nc = rotateCells(SHAPES[curKey], nr);
    for (const kick of [0, -1, 1, -2, 2]) {
      if (!collides(nc, curX + kick, curY)) {
        cur = nc; curRot = nr; curX += kick;
        return;
      }
    }
  }

  function hardDrop() {
    if (state !== 'playing') return;
    while (!collides(cur, curX, curY + 1)) curY++;
    lockPiece();
  }

  function beginIfReady() {
    if (state === 'ready') {
      state = 'playing';
      startMsg.style.display = 'none';
    }
  }

  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space','KeyA','KeyD','KeyS','KeyW'].includes(e.code)) e.preventDefault();
    if (e.code === 'KeyR' && state === 'over') { restart(); return; }
    beginIfReady();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') tryMove(-1, 0);
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') tryMove(1, 0);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') tryMove(0, 1);
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') tryRotate();
    else if (e.code === 'Space') hardDrop();
  });

  controls.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    beginIfReady();
    const act = btn.dataset.act;
    if (act === 'left') tryMove(-1, 0);
    else if (act === 'right') tryMove(1, 0);
    else if (act === 'rotate') tryRotate();
    else if (act === 'drop') hardDrop();
  });

  retryBtn.addEventListener('click', (e) => { e.stopPropagation(); restart(); });

  function reset() {
    board = emptyBoard();
    score = 0; lines = 0; tickMs = 650; acc = 0; lastT = 0;
    state = 'ready';
    nextKey = KEYS[Math.floor(Math.random()*KEYS.length)];
    spawn();
    scoreVal.textContent = '0';
    linesVal.textContent = '0';
    startMsg.style.display = 'block';
  }

  function restart() {
    overOverlay.classList.remove('show');
    reset();
  }

  function endGame() {
    state = 'over';
    if (score > best) { best = score; newBestFlag.style.visibility = 'visible'; }
    else newBestFlag.style.visibility = 'hidden';
    bestVal.textContent = String(best);
    finalScore.textContent = String(score);
    finalBest.textContent = String(best);
    setTimeout(() => overOverlay.classList.add('show'), 300);
  }

  function drawBlock(c, gx, gy, size, color) {
    const x = gx * size, y = gy * size;
    c.fillStyle = color;
    c.fillRect(x+1, y+1, size-2, size-2);
    c.fillStyle = 'rgba(255,255,255,0.4)';
    c.fillRect(x+1, y+1, size-2, Math.max(2, size*0.22));
    c.strokeStyle = '#100f24';
    c.lineWidth = 2;
    c.strokeRect(x+1, y+1, size-2, size-2);
  }

  function render() {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        ctx.fillStyle = (x+y)%2===0 ? '#f5fbff' : '#e7f2fb';
        ctx.fillRect(x*cell, y*cell, cell, cell);
        if (board[y][x]) drawBlock(ctx, x, y, cell, COLORS[board[y][x]]);
      }
    }
    if (state !== 'over') {
      for (const [cx, cy] of cur) {
        const gy = curY + cy;
        if (gy >= 0) drawBlock(ctx, curX + cx, gy, cell, COLORS[curKey]);
      }
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, 60, 60);
    const cells = SHAPES[nextKey];
    const xs = cells.map(p=>p[0]), ys = cells.map(p=>p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const w = maxX - minX + 1, h = maxY - minY + 1;
    const s = 13;
    const offX = (60 - w*s) / 2, offY = (60 - h*s) / 2;
    for (const [cx, cy] of cells) {
      const gx = (cx - minX), gy = (cy - minY);
      nctx.fillStyle = COLORS[nextKey];
      nctx.fillRect(offX + gx*s + 1, offY + gy*s + 1, s-2, s-2);
      nctx.strokeStyle = '#100f24';
      nctx.lineWidth = 1.5;
      nctx.strokeRect(offX + gx*s + 1, offY + gy*s + 1, s-2, s-2);
    }
  }

  function loop(t) {
    if (!lastT) lastT = t;
    const dt = t - lastT;
    lastT = t;
    if (state === 'playing') {
      acc += dt;
      while (acc >= tickMs) {
        tryMove(0, 1);
        acc -= tickMs;
        if (state !== 'playing') break;
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  resize();
  reset();
  render();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
